name: Content fix
description: A typo, wrong fact, confusing explanation or broken LeetCode link.
labels: ["content", "good first issue"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL or file
      placeholder: https://…/dsa/sliding-window  or  frontend/src/content/hld/lessons/caching-strategies.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Quote the sentence if you can.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
  - type: checkboxes
    id: pr
    attributes:
      label: Want to fix it yourself?
      options:
        - label: I'd like to open a PR for this
