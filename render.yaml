# Render Blueprint — render.com → New → Blueprint → pick this repo.
# (Or create the Web Service by hand with the same values; see README.)
services:
  - type: web
    name: ai-interview-coach-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        sync: false # enter it in the Render dashboard; never commit it
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: https://ai-interview-coach-drab-one.vercel.app,http://localhost:3000
